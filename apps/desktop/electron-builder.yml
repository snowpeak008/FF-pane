# T0.5 打包链路：electron-builder 最小可用配置（docs/技术选型.md §9，先只出 Windows NSIS）。
# 图标未配置，使用 Electron 默认图标：正式图标属 Phase 3 设计系统任务（T3.1）。

appId: com.ffpane.app
productName: FF-pane

directories:
  output: release

# devDependencies 里 electron 是 ^44 区间，而 hoisted 布局下包不在 apps/desktop/node_modules，
# electron-builder 推断不出精确版本，必须显式钉住；升级 electron 时需同步本行
# （与根 node_modules/electron/package.json 的实际安装版本一致）。
electronVersion: 44.0.0

# Electron 二进制直接取本机已就位的 node_modules/electron/dist（hoisted 布局在仓库根），
# 避免打包时从网络重复下载同版本发行包。
electronDist: ../../node_modules/electron/dist

# better-sqlite3 13.x 以 Node-API 预编译分发（ABI 稳定），无需对 Electron 重编译；
# 关闭可避免 electron-builder 触发 node-gyp / 包管理器安装（本仓库 lockfile 不允许变动）。
npmRebuild: false

# 应用源码只收 electron-vite 产物（out/main、out/preload、out/renderer）。
# package.json 恒定收录；生产依赖（better-sqlite3 / i18next / react-i18next 及其传递依赖）
# 由 electron-builder 的依赖收集器从仓库根 node_modules（pnpm hoisted 布局）解析收集，
# 不走本 files 匹配器——但 files 里的排除模式对收集到的依赖同样生效。
#
# koffi（T8.2 引入）的 npm 包把 C/C++ 源码、node-addon-api 头文件、文档与构建脚本一并发行。
# 运行期真正需要的只有（v0.9.x 清债单逐文件核实，读 koffi/index.cjs 的 require 链）：
#   index.cjs → src/koffi/index.cjs → src/koffi/src/static.cjs → @koromix/koffi-<platform>-<arch>
# 即 koffi/{index,indirect}.{cjs,js}、package.json、src/koffi/{index,indirect}.{cjs,js}、
# src/koffi/src/{static.cjs,static.js,trampolines.cjs}。**注意 src/ 不能整目录排除**——
# 它同时装着运行期 JS 与 C++ 源码，只能按文件排。
# 排除对象：doc/ lib/ vendor/ 三目录、cnoke.cjs（安装期构建脚本）、CMakeLists.txt、
# src/koffi/src 下的 .hh/.inc/.def 头文件与 abi/ 汇编（.cc 已被 electron-builder 默认过滤）。
# 排除前 asar 内 koffi 64 文件 941,157 B，排除后 13 文件（实测数字见 docs/开发进度.md §0）；
# live-job-object.mjs 判据①专门验「排除之后 koffi 仍能从 app.asar 内加载」。
files:
  - out/**
  - "!node_modules/koffi/{doc,lib,vendor}/**"
  - "!node_modules/koffi/cnoke.cjs"
  - "!node_modules/koffi/src/koffi/CMakeLists.txt"
  - "!node_modules/koffi/src/koffi/src/abi/**"
  - "!node_modules/koffi/src/koffi/src/*.{cc,hh,inc,def}"

asar: true
# 原生 .node 无法从 asar 内 dlopen，必须解包到 app.asar.unpacked。
# better-sqlite3 13.x 的绑定解析顺序（lib/binding.js）：
#   1) prebuilds/<platform>-<arch>.node —— Node-API 预编译，本机当前生效形态
#   2) build/{Debug,Release}/better_sqlite3.node —— node-gyp 源码编译形态
# 两种路径形态都覆盖，防止换机后依赖形态不同导致安装版加载失败。
# sqlite-vec（T6.4）同理：vec0.dll 由 SQLite 的 loadExtension 走系统 LoadLibrary 加载，
# asar 内的虚拟路径喂不进去。平台包名为 sqlite-vec-<os>-<arch>，通配覆盖全部平台，
# 免得将来出 macOS/Linux 包时漏掉。加载失败会降级到退路后端（见 knowledge-vector.ts），
# 不至于打不开知识库——但那是兜底，正常路径必须让它能加载。
# koffi（T8.2）同理：它自身是 JS，但真正的 FFI 实现是平台包
# @koromix/koffi-<platform>-<arch> 里的 koffi.node，走 dlopen 加载，asar 内路径喂不进去。
# 它承载的是「取消任务时把子进程树整个圈禁终止」这条路径（见 process/job-object.ts）；
# 加载失败会降级回 taskkill /T（功能仍在，只是重父化的孙进程可能残留），但那是兜底。
asarUnpack:
  - node_modules/better-sqlite3/build/Release/**
  - node_modules/better-sqlite3/prebuilds/**
  - node_modules/sqlite-vec-*/**
  - node_modules/@koromix/koffi-*/**

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # 向导式安装（非一键），允许用户自选安装目录
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 用户级安装（默认 %LOCALAPPDATA%\Programs\FF-pane），免管理员权限
  perMachine: false
  # 安装包文件名不含空格，便于脚本化静默安装
  artifactName: ${productName}-Setup-${version}.${ext}
