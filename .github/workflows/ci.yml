# CI：双平台 lint + test + build。
# 范围说明：Electron 打包/发布（electron-builder，T0.5 之后的发布 CI）不在本工作流内；
# 届时 Linux 侧才需要补充打包相关系统依赖（如 rpm/snapcraft 等），此处无需预置。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的新 push 取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      # 一个平台失败不取消另一个，保留完整的双平台信号
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pnpm 11+ 的官方 setup action（pnpm/action-setup 仅支持 v10 及以下；
      # corepack 已废弃且 Node 25 起从发行版移除，均不采用）：
      # - pnpm 版本读取根 package.json 的 packageManager 字段（pnpm@11.24.0），单一事实来源
      # - runtime: node@24 在同一步安装 Node.js（替代 actions/setup-node，对应 engines.node >=24）
      # - cache: true 缓存 pnpm store，key 基于 pnpm-lock.yaml 内容
      # - install: false 关闭内置安装，下一步显式执行 frozen-lockfile 安装
      - name: Setup pnpm + Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # 不加 --ignore-scripts：electron / better-sqlite3 / esbuild 的安装脚本
      # 由 pnpm-workspace.yaml 的 allowBuilds 白名单放行，是功能必需（T0.2 起）。
      # better-sqlite3 优先使用官方 prebuilt 二进制，仅在无匹配预编译产物时回退
      # node-gyp 源码编译（两类 runner 均预装 Python + 对应 C++ 工具链，可承受）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build 必须先于 Test：workspace 包的 exports 指向 dist/，
      # 跨包测试（如 core 测试 import @ff-pane/shared）在全新检出中
      # 依赖已构建的 dist 产物。
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
